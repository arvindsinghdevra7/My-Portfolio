      <stop offset="0%" stop-color="#0a1026" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg-car)"/>
  <rect x="20" y="20" width="560" height="300" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Browser Header -->
  <rect x="20" y="20" width="560" height="36" rx="12" fill="#1e293b"/>
  <circle cx="45" cy="38" r="5" fill="#ef4444"/>
  <circle cx="62" cy="38" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="38" r="5" fill="#10b981"/>
  <rect x="120" y="28" width="360" height="20" rx="6" fill="#0f172a"/>
  <text x="200" y="42" fill="#38bdf8" font-family="monospace" font-size="11">https://parthcarrental.com</text>
  
  <!-- Car Graphic & UI -->
  <rect x="50" y="80" width="220" height="120" rx="8" fill="#1e293b" opacity="0.6"/>
  <path d="M 80 160 L 110 120 L 190 120 L 220 160 L 240 160 Q 250 160 250 175 L 60 175 Q 60 160 80 160 Z" fill="url(#cyan-grad)"/>
  <circle cx="100" cy="175" r="14" fill="#0f172a" stroke="#00f2fe" stroke-width="3"/>
  <circle cx="200" cy="175" r="14" fill="#0f172a" stroke="#00f2fe" stroke-width="3"/>
  <text x="75" y="105" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="14">Luxury Car Booking</text>
  <text x="75" y="125" fill="#34d399" font-family="monospace" font-size="11">⚡ Instant Confirmation</text>

  <!-- Right side cards -->
  <rect x="300" y="80" width="240" height="40" rx="6" fill="#1e293b"/>
  <rect x="315" y="93" width="70" height="14" rx="4" fill="#00f2fe" opacity="0.8"/>
  <rect x="400" y="93" width="120" height="14" rx="4" fill="#334155"/>

  <rect x="300" y="135" width="240" height="40" rx="6" fill="#1e293b"/>
  <rect x="315" y="148" width="90" height="14" rx="4" fill="#4facfe" opacity="0.8"/>
  <rect x="420" y="148" width="100" height="14" rx="4" fill="#334155"/>

  <rect x="300" y="190" width="240" height="40" rx="6" fill="#1e293b"/>
  <rect x="315" y="203" width="110" height="14" rx="4" fill="#10b981" opacity="0.8"/>
  <rect x="440" y="203" width="80" height="14" rx="4" fill="#334155"/>

  <!-- Bottom CTA bar -->
  <rect x="50" y="245" width="490" height="50" rx="8" fill="#1e293b"/>
  <text x="75" y="275" fill="#94a3b8" font-family="sans-serif" font-size="13">MERN Stack Architecture • Responsive Mobile Engine</text>
  <rect x="430" y="255" width="95" height="30" rx="15" fill="url(#cyan-grad)"/>
  <text x="448" y="274" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="11">BOOK NOW</text>
