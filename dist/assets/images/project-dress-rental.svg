<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-dress" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e102a" />
      <stop offset="100%" stop-color="#2a1236" />
    </linearGradient>
    <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg-dress)"/>
  <rect x="20" y="20" width="560" height="300" rx="12" fill="#13091c" stroke="#3b1d54" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="560" height="45" rx="12" fill="#241038"/>
  <text x="50" y="48" fill="#f472b6" font-family="sans-serif" font-weight="bold" font-size="16">CoutureRent • Designer Wardrobe Booking</text>
  <rect x="440" y="32" width="110" height="22" rx="11" fill="url(#purple-grad)"/>
  <text x="455" y="47" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="10">ADMIN WORKFLOW</text>

  <!-- Left: Dress Card Showcase -->
  <rect x="50" y="85" width="220" height="210" rx="10" fill="#201130" stroke="#4a206c" stroke-width="1"/>
  <rect x="70" y="105" width="180" height="110" rx="6" fill="#2d1744"/>
  <path d="M 135 125 C 145 125, 150 140, 160 140 C 170 140, 175 125, 185 125 L 205 200 L 115 200 Z" fill="url(#pink-grad)"/>
  <text x="75" y="238" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="12">Royal Evening Gown</text>
  <text x="75" y="258" fill="#ec4899" font-family="monospace" font-size="11">Rental: $45 / 3-Days</text>
  <rect x="75" y="268" width="170" height="18" rx="4" fill="url(#purple-grad)"/>
  <text x="110" y="281" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="9">CHECK CALENDAR</text>

  <!-- Right: Calendar & Availability Engine -->
  <rect x="290" y="85" width="260" height="210" rx="10" fill="#201130" stroke="#4a206c" stroke-width="1"/>
  <text x="310" y="115" fill="#f472b6" font-family="sans-serif" font-weight="bold" font-size="13">Rental Availability Calendar</text>
  
  <!-- Mini calendar grid -->
  <g transform="translate(310, 130)">
    <rect x="0" y="0" width="30" height="25" rx="4" fill="#3b1d54"/><text x="10" y="17" fill="#cbd5e1" font-size="11">12</text>
    <rect x="35" y="0" width="30" height="25" rx="4" fill="#3b1d54"/><text x="45" y="17" fill="#cbd5e1" font-size="11">13</text>
    <rect x="70" y="0" width="30" height="25" rx="4" fill="#10b981"/><text x="80" y="17" fill="#fff" font-size="11">14</text>
    <rect x="105" y="0" width="30" height="25" rx="4" fill="#10b981"/><text x="115" y="17" fill="#fff" font-size="11">15</text>
    <rect x="140" y="0" width="30" height="25" rx="4" fill="#10b981"/><text x="150" y="17" fill="#fff" font-size="11">16</text>
    <rect x="175" y="0" width="30" height="25" rx="4" fill="#ef4444"/><text x="185" y="17" fill="#fff" font-size="11">17</text>

    <rect x="0" y="32" width="30" height="25" rx="4" fill="#ef4444"/><text x="10" y="49" fill="#fff" font-size="11">18</text>
    <rect x="35" y="32" width="30" height="25" rx="4" fill="#3b1d54"/><text x="45" y="49" fill="#cbd5e1" font-size="11">19</text>
    <rect x="70" y="32" width="30" height="25" rx="4" fill="#3b1d54"/><text x="80" y="49" fill="#cbd5e1" font-size="11">20</text>
    <rect x="105" y="32" width="30" height="25" rx="4" fill="#10b981"/><text x="115" y="49" fill="#fff" font-size="11">21</text>
    <rect x="140" y="32" width="30" height="25" rx="4" fill="#10b981"/><text x="150" y="49" fill="#fff" font-size="11">22</text>
    <rect x="175" y="32" width="30" height="25" rx="4" fill="#10b981"/><text x="185" y="49" fill="#fff" font-size="11">23</text>
  </g>

  <rect x="310" y="215" width="220" height="30" rx="6" fill="#2d1744"/>
  <text x="325" y="235" fill="#34d399" font-family="sans-serif" font-size="11">🟢 Sept 14-16 Slot Reserved</text>

  <rect x="310" y="255" width="220" height="26" rx="6" fill="url(#pink-grad)"/>
  <text x="375" y="272" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="11">CONFIRM BOOKING</text>
</svg>
