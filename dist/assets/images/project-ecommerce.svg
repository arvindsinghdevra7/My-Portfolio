<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ecom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e3a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg-ecom)"/>
  <rect x="20" y="20" width="560" height="300" rx="12" fill="#0f172a" stroke="#1e3a8a" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="560" height="45" rx="12" fill="#1e293b"/>
  <text x="50" y="48" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="16">TechStore MERN • Electronics Hub</text>
  <rect x="420" y="32" width="130" height="22" rx="11" fill="url(#blue-grad)"/>
  <text x="435" y="47" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="10">JWT AUTH + CART</text>

  <!-- Products Showcase -->
  <rect x="50" y="85" width="150" height="135" rx="10" fill="#1e293b"/>
  <rect x="80" y="100" width="90" height="60" rx="6" fill="#334155"/>
  <text x="75" y="180" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="12">Smart Watch V3</text>
  <text x="100" y="200" fill="#38bdf8" font-family="monospace" font-size="11">$199.00</text>

  <rect x="225" y="85" width="150" height="135" rx="10" fill="#1e293b"/>
  <rect x="255" y="100" width="90" height="60" rx="6" fill="#334155"/>
  <text x="245" y="180" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="12">Noise-Cancel Pro</text>
  <text x="275" y="200" fill="#38bdf8" font-family="monospace" font-size="11">$249.00</text>

  <rect x="400" y="85" width="150" height="135" rx="10" fill="#1e293b"/>
  <rect x="430" y="100" width="90" height="60" rx="6" fill="#334155"/>
  <text x="430" y="180" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="12">Laptop 16" X</text>
  <text x="450" y="200" fill="#38bdf8" font-family="monospace" font-size="11">$899.00</text>

  <!-- Cart bar summary -->
  <rect x="50" y="240" width="500" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="75" y="275" fill="#f8fafc" font-family="sans-serif" font-size="13">🛒 Cart (2 Items) | Total: $448.00</text>
  <rect x="400" y="250" width="130" height="38" rx="8" fill="url(#blue-grad)"/>
  <text x="425" y="274" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="12">CHECKOUT</text>
</svg>
