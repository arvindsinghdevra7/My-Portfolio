<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-hotel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b24" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg-hotel)"/>
  <rect x="20" y="20" width="560" height="300" rx="12" fill="#042018" stroke="#065f46" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="560" height="45" rx="12" fill="#064e3b"/>
  <text x="50" y="48" fill="#6ee7b7" font-family="sans-serif" font-weight="bold" font-size="16">GrandPalace • Hotel & Room Reservation System</text>
  <rect x="440" y="32" width="110" height="22" rx="11" fill="url(#emerald-grad)"/>
  <text x="455" y="47" fill="#042018" font-family="sans-serif" font-weight="bold" font-size="10">PHP + MYSQL</text>

  <!-- Left: Room booking form -->
  <rect x="50" y="85" width="230" height="210" rx="10" fill="#0b382d"/>
  <text x="70" y="115" fill="#a7f3d0" font-family="sans-serif" font-weight="bold" font-size="13">Room Booking Console</text>
  <rect x="70" y="130" width="190" height="26" rx="4" fill="#042018"/>
  <text x="80" y="147" fill="#6ee7b7" font-family="monospace" font-size="10">Guest: Anand Goswami</text>
  <rect x="70" y="165" width="190" height="26" rx="4" fill="#042018"/>
  <text x="80" y="182" fill="#6ee7b7" font-family="monospace" font-size="10">Room: Deluxe Suite 304</text>
  <rect x="70" y="200" width="190" height="26" rx="4" fill="#042018"/>
  <text x="80" y="217" fill="#6ee7b7" font-family="monospace" font-size="10">Dates: 21 Sep - 25 Sep</text>
  <rect x="70" y="240" width="190" height="32" rx="6" fill="url(#emerald-grad)"/>
  <text x="110" y="261" fill="#042018" font-family="sans-serif" font-weight="bold" font-size="12">RESERVE ROOM</text>

  <!-- Right: Status table -->
  <rect x="300" y="85" width="250" height="210" rx="10" fill="#0b382d"/>
  <text x="320" y="115" fill="#a7f3d0" font-family="sans-serif" font-weight="bold" font-size="13">Room Inventory Status</text>
  <rect x="320" y="135" width="210" height="30" rx="4" fill="#042018"/>
  <text x="330" y="154" fill="#f8fafc" font-size="11">Room 101 - Standard (Booked)</text>
  <rect x="320" y="175" width="210" height="30" rx="4" fill="#042018"/>
  <text x="330" y="194" fill="#34d399" font-size="11">Room 202 - Executive (Available)</text>
  <rect x="320" y="215" width="210" height="30" rx="4" fill="#042018"/>
  <text x="330" y="234" fill="#34d399" font-size="11">Room 304 - Deluxe (Reserved)</text>
  <rect x="320" y="255" width="210" height="25" rx="4" fill="#064e3b"/>
  <text x="350" y="272" fill="#6ee7b7" font-size="10">Connected to MySQL DB</text>
</svg>
